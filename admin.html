<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração • AutoCheck</title><style>body{font:15px system-ui;margin:0;background:#f3f6fa;color:#152238}header{background:#164b98;color:#fff;padding:18px}main{max-width:900px;margin:18px auto;padding:0 12px}.card{background:#fff;border:1px solid #dce3ec;border-radius:16px;padding:18px;margin-bottom:14px}.user{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #dce3ec;border-radius:12px;padding:13px;margin:8px 0}.pill{padding:5px 9px;border-radius:999px;background:#eaf1fb;color:#164b98;font-weight:800;font-size:12px}button{padding:10px 13px;border-radius:10px;border:1px solid #164b98;background:#fff;color:#164b98;font-weight:800;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}</style></head><body><header><div class="top"><div><b>Locar Útil AutoCheck</b><br><small>Área administrativa</small></div><button id="back">Voltar</button></div></header><main><div class="card"><h2>Usuários</h2><p>As contas e senhas são criadas em Supabase → Authentication → Users. Aqui o administrador controla nome, perfil e situação do acesso.</p><div id="users">Carregando...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await window.appAuth.init();if(!u||u.perfil!=='admin'){location.replace('index.html');return}document.getElementById('back').onclick=()=>location.href='index.html';const c=window.appAuth.client;async function load(){const {data,error}=await c.from('app_users').select('*').order('nome');if(error){document.getElementById('users').textContent=error.message;return}document.getElementById('users').innerHTML=(data||[]).map(x=>`<div class="user"><div><b>${esc(x.nome)}</b><br><span class="pill">${esc(x.perfil)}</span> ${x.ativo?'Ativo':'Inativo'}</div><button onclick="toggleUser('${x.id}',${!x.ativo})">${x.ativo?'Desativar':'Ativar'}</button></div>`).join('')||'Nenhum usuário cadastrado.'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}window.toggleUser=async(id,ativo)=>{const {error}=await c.from('app_users').update({ativo}).eq('id',id);if(error)alert(error.message);else load()};load()});</script></body></html>
