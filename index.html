<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#164b98"><link rel="manifest" href="manifest.webmanifest"><title>Locar Útil AutoCheck</title><style>body{font:15px system-ui;margin:0;background:#f3f6fa;color:#152238}header{background:#164b98;color:#fff;padding:14px}.brand{display:flex;align-items:center;gap:14px;max-width:1100px;margin:auto}.logo{width:150px;height:55px;object-fit:contain;background:#fff;border-radius:8px}.sync{margin-left:auto}.tabs,main{max-width:1100px;margin:auto}.tabs{display:flex;gap:8px;padding:14px;overflow:auto}.tab{border:0;padding:11px 15px;border-radius:12px;color:#164b98;font-weight:750}.tab.active{background:#ed1018;color:#fff}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid #dce3ec;border-radius:16px;padding:18px;margin:0 14px 14px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:650}input,select{width:100%;margin-top:6px;padding:12px;border:1px solid #cbd5e2;border-radius:10px;box-sizing:border-box}.full{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{cursor:pointer}.primary,.finish,.danger,.secondary{padding:12px 16px;border-radius:11px;font-weight:800}.primary{border:0;background:#ed1018;color:#fff}.finish{border:0;background:#16835d;color:#fff}.danger{border:0;background:#ed1018;color:#fff}.secondary{border:1px solid #164b98;background:#fff;color:#164b98}.section-title{margin-top:20px;color:#0b316d}.note{background:#fff7df;padding:11px;border-left:4px solid #e49618}.attachments{display:grid;gap:8px;margin-top:12px}.file{display:flex;justify-content:space-between;padding:10px;border:1px solid #dce3ec;border-radius:10px}.job{border:1px solid #dce3ec;padding:14px;border-radius:13px;margin:10px 0}.job.cancelled{border:2px solid #ed1018;background:#fff0f0}.pill{padding:5px 9px;border-radius:999px;background:#eaf1fb;color:#164b98;font-weight:800;font-size:12px}.route{color:#637083;margin:8px 0}@media(max-width:640px){.fields{grid-template-columns:1fr}.full{grid-column:auto}.logo{width:120px;height:45px}.card{margin:0 8px 10px;padding:14px}}@media print{header,.tabs,.actions{display:none}}</style></head><body><header><div class="brand"><img class="logo" src="icon.svg" alt="Locar Útil"><div><b>AutoCheck</b><br><small>Checklist de remoção de veículos</small></div><span id="syncStatus" class="sync">Conectando...</span></div></header><nav class="tabs"><button class="tab active" data-page="painel">Painel</button><button class="tab" data-page="novo">Novo chamado</button><button class="tab" data-page="vistoria">Checklist</button><button class="tab" data-page="consultar">Consultar</button></nav><main><section id="painel" class="page active"><div class="card"><h2>Painel operacional</h2><div id="jobs"></div></div></section><section id="novo" class="page"><form id="jobForm" class="card"><h2>Abrir chamado</h2><div class="fields"><label>Modelo<input name="modelo" required></label><label>Ano<input name="ano" required></label><label class="full">Chassi<input name="chassi" required></label><label class="full">Local da coleta<input name="coleta" required></label><label class="full">Local da entrega<input name="entrega" required></label></div><div class="actions"><button class="primary">Registrar chamado</button></div></form></section><section id="vistoria" class="page"><div class="card"><h2>Checklist do veículo</h2><label>Selecionar chamado<select id="jobSelect"></select></label><div id="guinchoFields" class="fields" style="margin-top:14px"><label>Placa do guincho<input id="guinchoPlaca" maxlength="8" placeholder="Ex.: ABC1D23"></label><label>Nome do prestador<input id="prestadorNome" maxlength="120" placeholder="Nome completo"></label></div><h3 class="section-title">Fotos do checklist físico</h3><div class="note">Fotos da galeria ou PDF. Limite de 20 MB por arquivo.</div><label>Selecionar fotos<input id="physicalFiles" type="file" accept="image/*,application/pdf" multiple></label><div id="physicalPreview" class="attachments"></div><h3 class="section-title">Fotos de possíveis avarias</h3><label>Selecionar fotos de avarias<input id="damageFiles" type="file" accept="image/*,application/pdf" multiple></label><div id="damagePreview" class="attachments"></div><div class="actions"><button class="primary" id="saveInspection" type="button">Salvar checklist</button><button class="finish" id="finishService" type="button">Finalizar serviço</button><button class="danger" id="cancelSelected" type="button">Cancelar chamado</button></div></div></section><section id="detalhe" class="page"><div class="card"><button class="secondary" onclick="showPage('painel')">Voltar</button><div id="jobDetail"></div></div></section><section id="consultar" class="page"><div class="card"><h2>Consultar chamado</h2><input id="search" placeholder="Modelo, chassi ou número"><div id="results"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="backend.js"></script><script>const KEY='locarUtilAutoCheckJobs';let jobs=JSON.parse(localStorage.getItem(KEY)||'[]'),physicalUploads=[],damageUploads=[];const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));$$('.tab').forEach(b=>b.onclick=()=>showPage(b.dataset.page));function showPage(id){$$('.tab,.page').forEach(x=>x.classList.remove('active'));const t=$(`.tab[data-page="${id}"]`);if(t)t.classList.add('active');$('#'+id).classList.add('active');render()}function code(){return 'LU-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-6)}async function save(){localStorage.setItem(KEY,JSON.stringify(jobs));render();if(onlineStore.configured)try{await onlineStore.save(jobs)}catch(e){alert('Erro ao sincronizar: '+e.message)}}function card(j){return `<article class="job ${j.status==='Cancelado'?'cancelled':''}"><b>${esc(j.id)} - ${esc(j.modelo)} ${esc(j.ano)}</b> <span class="pill">${esc(j.status||'Novo')}</span><div>Chassi: ${esc(j.chassi)}</div><div class="route">📍 ${esc(j.coleta)} → ${esc(j.entrega)}</div>${j.guinchoPlaca?`<div><b>Placa do guincho:</b> ${esc(j.guinchoPlaca)}</div>`:''}${j.prestadorNome?`<div><b>Prestador:</b> ${esc(j.prestadorNome)}</div>`:''}<div class="actions"><button class="secondary" onclick="openJob('${j.id}')">Abrir chamado</button>${j.status!=='Cancelado'&&j.status!=='Entregue'?`<button class="danger" onclick="cancelJob('${j.id}')">Cancelar</button>`:''}</div></article>`}function render(){if($('#jobs'))$('#jobs').innerHTML=jobs.length?jobs.slice().reverse().map(card).join(''):'Nenhum chamado.';$('#jobSelect').innerHTML='<option value="">Selecione</option>'+jobs.filter(j=>!['Cancelado','Entregue'].includes(j.status)).map(j=>`<option value="${j.id}">${esc(j.id)} - ${esc(j.modelo)}</option>`).join('');loadFields();doSearch()}function loadFields(){const j=jobs.find(x=>x.id===$('#jobSelect').value);$('#guinchoPlaca').value=j?.guinchoPlaca||'';$('#prestadorNome').value=j?.prestadorNome||''}function persistFields(){const j=jobs.find(x=>x.id===$('#jobSelect').value);if(!j)return;j.guinchoPlaca=$('#guinchoPlaca').value.trim().toUpperCase();j.prestadorNome=$('#prestadorNome').value.trim()}$('#jobSelect').onchange=loadFields;$('#guinchoPlaca').oninput=$('#prestadorNome').oninput=persistFields;$('#jobForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));jobs.push({...d,id:code(),status:'Novo',createdAt:new Date().toISOString(),inspections:[]});save();e.target.reset();showPage('painel')};function readFiles(list){const a=[...list];if(a.some(f=>f.size>20*1024*1024)){alert('Cada arquivo pode ter no máximo 20 MB.');return []}return a.map(file=>({name:file.name,type:file.type,size:file.size,file}))}function draw(a,t,k){$(t).innerHTML=a.map((f,i)=>`<div class="file">📷 ${esc(f.name)} <button class="secondary" onclick="removeUpload('${k}',${i})">Remover</button></div>`).join('')}$('#physicalFiles').onchange=e=>{physicalUploads=readFiles(e.target.files);draw(physicalUploads,'#physicalPreview','p')};$('#damageFiles').onchange=e=>{damageUploads=readFiles(e.target.files);draw(damageUploads,'#damagePreview','d')};function removeUpload(k,i){(k==='p'?physicalUploads:damageUploads).splice(i,1);draw(k==='p'?physicalUploads:damageUploads,k==='p'?'#physicalPreview':'#damagePreview',k)}$('#saveInspection').onclick=async()=>{const j=jobs.find(x=>x.id===$('#jobSelect').value);if(!j)return alert('Selecione um chamado.');persistFields();if(!physicalUploads.length&&!damageUploads.length)return alert('Inclua pelo menos um arquivo.');if(!onlineStore.configured)return alert('Armazenamento online não configurado.');try{const p=await Promise.all(physicalUploads.map(f=>onlineStore.upload(f.file,j.id,'fisico'))),d=await Promise.all(damageUploads.map(f=>onlineStore.upload(f.file,j.id,'avaria')));j.inspections.push({date:new Date().toISOString(),physicalFiles:p,damageFiles:d,files:[...p,...d]});j.status='Em transporte';await save();physicalUploads=[];damageUploads=[];$('#physicalFiles').value='';$('#damageFiles').value='';draw([],'#physicalPreview','p');draw([],'#damagePreview','d');alert('Checklist salvo online.')}catch(e){alert('Falha: '+e.message)}};$('#finishService').onclick=()=>{const j=jobs.find(x=>x.id===$('#jobSelect').value);if(!j)return alert('Selecione um chamado.');persistFields();if(!j.inspections?.length)return alert('Salve o checklist antes de finalizar.');j.status='Entregue';j.completedAt=new Date().toISOString();save();showPage('painel')};$('#cancelSelected').onclick=()=>{const j=jobs.find(x=>x.id===$('#jobSelect').value);if(!j)return alert('Selecione um chamado.');cancelJob(j.id)};function cancelJob(id){const j=jobs.find(x=>x.id===id);if(j&&confirm('Cancelar este chamado?')){j.status='Cancelado';j.cancelledAt=new Date().toISOString();save()}}function openJob(id){const j=jobs.find(x=>x.id===id);if(!j)return;$('#jobDetail').innerHTML=`<h2>${esc(j.id)} - ${esc(j.modelo)} ${esc(j.ano)}</h2><p><span class="pill">${esc(j.status)}</span></p><p><b>Chassi:</b> ${esc(j.chassi)}</p><p><b>Coleta:</b> ${esc(j.coleta)}</p><p><b>Entrega:</b> ${esc(j.entrega)}</p><p><b>Placa do guincho:</b> ${esc(j.guinchoPlaca||'Não informada')}</p><p><b>Nome do prestador:</b> ${esc(j.prestadorNome||'Não informado')}</p><h3>Checklists e arquivos</h3>${(j.inspections||[]).map((ins,n)=>`<div class="job"><b>Checklist ${n+1}</b><div class="attachments">${(ins.files||[]).map(f=>`<div class="file">${f.type?.startsWith('image/')?'📷':'📄'} ${esc(f.name)} <a href="${f.url||f.data}" target="_blank">Abrir</a></div>`).join('')}</div></div>`).join('')||'Nenhum checklist salvo.'}`;showPage('detalhe')}$('#search').oninput=doSearch;function doSearch(){const q=($('#search')?.value||'').toLowerCase();if($('#results'))$('#results').innerHTML=jobs.filter(j=>[j.id,j.modelo,j.ano,j.chassi,j.guinchoPlaca,j.prestadorNome].some(v=>String(v||'').toLowerCase().includes(q))).slice().reverse().map(card).join('')||'Nenhum resultado.'}async function start(){if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');if(onlineStore.configured){$('#syncStatus').textContent='Online • tempo real';try{const r=await onlineStore.load();if(r){jobs=r;localStorage.setItem(KEY,JSON.stringify(jobs))}onlineStore.subscribe(r=>{jobs=r;localStorage.setItem(KEY,JSON.stringify(jobs));render()})}catch(e){$('#syncStatus').textContent='Offline'}}render()}start();</script></body></html>
