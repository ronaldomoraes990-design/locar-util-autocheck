<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#164b98"><meta name="description" content="Gestão de coleta, vistoria e entrega de veículos da Locar Útil">
<link rel="manifest" href="manifest.webmanifest"><title>Locar Útil AutoCheck</title>
<style>
:root{--blue:#164b98;--blue2:#0b316d;--red:#ed1018;--bg:#f3f6fa;--ink:#152238;--muted:#637083;--card:#fff;--line:#dce3ec;--ok:#16835d;--warn:#e49618}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;padding:14px 18px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px #001a3b30}
.brand{display:flex;align-items:center;gap:12px;max-width:1100px;margin:auto}.brand svg{width:122px;height:48px;background:white;border-radius:8px;padding:6px}.brand h1{font-size:18px;margin:0}.brand small{opacity:.8}
main{max-width:1100px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tab{border:0;background:white;padding:11px 15px;border-radius:12px;color:var(--blue);font-weight:700;white-space:nowrap}.tab.active{background:var(--red);color:#fff}
.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 12;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 18px #18345a0d}
.card h2,.card h3{margin:0 0 14px;color:var(--blue2)}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:650;color:#34445c}input,select,textarea{width:100%;margin-top:6px;padding:12px;border:1px solid #cbd5e2;border-radius:10px;background:#fff;font:inherit}textarea{min-height:82px;resize:vertical}.full{grid-column:1/-1}
button.primary{border:0;background:var(--red);color:#fff;padding:13px 18px;border-radius:11px;font-weight:800;cursor:pointer}button.secondary{border:1px solid var(--blue);background:#fff;color:var(--blue);padding:11px 15px;border-radius:11px;font-weight:750;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;border-radius:14px;background:#eef4fc;border-left:5px solid var(--blue)}.stat b{display:block;font-size:24px}.stat.red{border-color:var(--red)}.stat.green{border-color:var(--ok)}.stat.orange{border-color:var(--warn)}
.job{border:1px solid var(--line);padding:14px;border-radius:13px;margin:10px 0}.jobtop{display:flex;justify-content:space-between;gap:10px}.pill{padding:5px 9px;border-radius:999px;background:#eaf1fb;color:var(--blue);font-size:12px;font-weight:800}.route{color:var(--muted);margin:8px 0}.photozone{position:relative;display:inline-block;max-width:100%;margin-top:12px}.photozone img{display:block;max-width:100%;max-height:480px;border-radius:12px}.mark{position:absolute;width:28px;height:28px;margin:-14px;border-radius:50%;background:var(--red);color:#fff;border:3px solid white;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 8px #0008}
.note{background:#fff7df;border-left:4px solid var(--warn);padding:11px;border-radius:8px;margin:12px 0}.empty{text-align:center;color:var(--muted);padding:24px}
@media(min-width:760px){.half{grid-column:span 6}}@media(max-width:640px){main{padding:12px}.fields,.stats{grid-template-columns:1fr}.brand h1{font-size:16px}.card{padding:14px}}
@media print{header,.tabs,.actions{display:none}body{background:white}.card{box-shadow:none}}
</style>
</head>
<body>
<header><div class="brand">
<svg viewBox="0 0 300 95" aria-label="Locar Útil"><text x="2" y="70" font-size="65" font-weight="900" fill="#21549c" font-family="Arial">Locar</text><text x="151" y="70" font-size="65" font-weight="900" fill="#ed1018" font-family="Arial">Útil</text><path d="M160 12h112v18H151z" fill="#ed1018"/></svg>
<div><h1>AutoCheck</h1><small>Coleta, vistoria e entrega de veículos</small></div></div></header>
<main>
<nav class="tabs"><button class="tab active" data-page="painel">Painel</button><button class="tab" data-page="novo">Novo chamado</button><button class="tab" data-page="vistoria">Vistoria</button><button class="tab" data-page="consultar">Consultar</button></nav>

<section id="painel" class="page active">
<div class="card"><h2>Painel operacional</h2><div class="stats"><div class="stat"><small>Novos</small><b id="sNovo">0</b></div><div class="stat orange"><small>Designados</small><b id="sDesignado">0</b></div><div class="stat red"><small>Em transporte</small><b id="sTransporte">0</b></div><div class="stat green"><small>Entregues</small><b id="sEntregue">0</b></div></div></div>
<div class="card" style="margin-top:14px"><h3>Chamados recentes</h3><div id="jobs"></div></div>
</section>

<section id="novo" class="page"><form id="jobForm" class="card">
<h2>Abrir chamado</h2><div class="fields">
<label>Cliente<input name="cliente" required placeholder="Empresa ou responsável"></label>
<label>Telefone<input name="telefone" inputmode="tel" placeholder="(11) 99999-9999"></label>
<label>Modelo do veículo<input name="modelo" required placeholder="Ex.: Toyota Corolla"></label>
<label>Número do chassi<input name="chassi" required maxlength="17" placeholder="17 caracteres"></label>
<label>Placa<input name="placa" maxlength="8" placeholder="ABC1D23"></label>
<label>Status<select name="status"><option>Novo</option><option>Designado</option><option>Em transporte</option><option>Entregue</option></select></label>
<label>Local de coleta<input name="coleta" required placeholder="Endereço completo"></label>
<label>Data e horário da coleta<input name="horaColeta" type="datetime-local" required></label>
<label>Local de entrega<input name="entrega" required placeholder="Concessionária / endereço"></label>
<label>Data e horário da entrega<input name="horaEntrega" type="datetime-local" required></label>
<label>Prestador designado<input name="prestador" placeholder="Nome do motorista/prestador"></label>
<label class="full">Observações<textarea name="obs" placeholder="Instruções importantes"></textarea></label>
</div><div class="actions"><button class="primary" type="submit">Registrar chamado</button><button class="secondary" type="reset">Limpar</button></div>
</form></section>

<section id="vistoria" class="page"><div class="grid">
<div class="card half"><h2>Checklist físico</h2>
<label>Chamado<select id="jobSelect"></select></label>
<div class="fields" style="margin-top:12px"><label><input type="checkbox" class="check"> Frente</label><label><input type="checkbox" class="check"> Traseira</label><label><input type="checkbox" class="check"> Lateral esquerda</label><label><input type="checkbox" class="check"> Lateral direita</label><label><input type="checkbox" class="check"> Interior</label><label><input type="checkbox" class="check"> Rodas e pneus</label></div>
<label>Quilometragem<input id="km" type="number" inputmode="numeric"></label>
<label>Resultado<select id="resultado"><option>Sem avarias aparentes</option><option>Com avarias registradas</option></select></label>
</div>
<div class="card half"><h2>Foto e marcação de avarias</h2><div class="note">Tire uma foto e toque sobre o ponto da avaria. Cada toque cria uma marca numerada.</div>
<label>Fotografar ou escolher imagem<input id="photo" type="file" accept="image/*" capture="environment"></label>
<div id="photoZone" class="photozone"></div>
<label>Descrição das avarias<textarea id="damageNotes" placeholder="Ex.: 1 — risco na porta dianteira esquerda"></textarea></label>
<div class="actions"><button class="secondary" id="clearMarks" type="button">Limpar marcações</button><button class="primary" id="saveInspection" type="button">Salvar vistoria</button></div>
</div></div></section>

<section id="consultar" class="page"><div class="card"><h2>Consultar chamado</h2><label>Chassi, placa, modelo ou número<input id="search" placeholder="Digite para pesquisar"></label><div id="results"></div></div></section>
</main>
<script>
const KEY='locarUtilAutoCheckJobs'; let jobs=JSON.parse(localStorage.getItem(KEY)||'[]'); let currentPhoto=''; let marks=[];
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.page).classList.add('active');render()});
function save(){localStorage.setItem(KEY,JSON.stringify(jobs));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function code(){return 'LU-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-6)}
function render(){
 const count=s=>jobs.filter(j=>j.status===s).length; $('#sNovo').textContent=count('Novo');$('#sDesignado').textContent=count('Designado');$('#sTransporte').textContent=count('Em transporte');$('#sEntregue').textContent=count('Entregue');
 $('#jobs').innerHTML=jobs.length?jobs.slice().reverse().map(j=>`<article class="job"><div class="jobtop"><b>${esc(j.id)} · ${esc(j.modelo)}</b><span class="pill">${esc(j.status)}</span></div><div>Chassi: ${esc(j.chassi)} ${j.placa?'· Placa: '+esc(j.placa):''}</div><div class="route">📍 ${esc(j.coleta)} → ${esc(j.entrega)}</div><small>Prestador: ${esc(j.prestador||'A designar')}</small></article>`).join(''):'<div class="empty">Nenhum chamado registrado.</div>';
 $('#jobSelect').innerHTML='<option value="">Selecione</option>'+jobs.map(j=>`<option value="${j.id}">${j.id} — ${esc(j.modelo)}</option>`).join('');
 doSearch();
}
$('#jobForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));jobs.push({...d,id:code(),createdAt:new Date().toISOString(),inspections:[]});save();e.target.reset();alert('Chamado registrado com sucesso.');$('.tab[data-page="painel"]').click()};
$('#photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{currentPhoto=r.result;marks=[];drawPhoto()};r.readAsDataURL(f)};
function drawPhoto(){const z=$('#photoZone');z.innerHTML=currentPhoto?'<img id="vehiclePhoto" src="'+currentPhoto+'" alt="Foto do veículo">':'';marks.forEach((m,i)=>{const d=document.createElement('span');d.className='mark';d.textContent=i+1;d.style.left=m.x+'%';d.style.top=m.y+'%';z.appendChild(d)});const img=$('#vehiclePhoto');if(img)img.onclick=e=>{const r=img.getBoundingClientRect();marks.push({x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100});drawPhoto()} }
$('#clearMarks').onclick=()=>{marks=[];drawPhoto()};
$('#saveInspection').onclick=()=>{const id=$('#jobSelect').value,j=jobs.find(x=>x.id===id);if(!j)return alert('Selecione um chamado.');if(!currentPhoto)return alert('Inclua uma foto.');j.inspections.push({date:new Date().toISOString(),km:$('#km').value,result:$('#resultado').value,notes:$('#damageNotes').value,marks,photo:currentPhoto});if(j.status==='Novo')j.status='Em transporte';save();alert('Vistoria salva neste aparelho.');};
$('#search').oninput=doSearch;function doSearch(){const q=($('#search')?.value||'').toLowerCase();const list=jobs.filter(j=>Object.values(j).some(v=>String(v).toLowerCase().includes(q)));if($('#results'))$('#results').innerHTML=list.length?list.slice().reverse().map(j=>`<article class="job"><div class="jobtop"><b>${esc(j.id)} · ${esc(j.modelo)}</b><span class="pill">${esc(j.status)}</span></div><div>Chassi: ${esc(j.chassi)}</div><div class="route">${esc(j.coleta)} → ${esc(j.entrega)}</div><small>${j.inspections?.length||0} vistoria(s)</small></article>`).join(''):'<div class="empty">Nenhum resultado.</div>'}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
