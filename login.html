<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164b98"><title>Login • Locar Útil AutoCheck</title><style>body{font:15px system-ui;margin:0;background:#f3f6fa;color:#152238;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #dce3ec;border-radius:18px;padding:28px;box-sizing:border-box;box-shadow:0 8px 30px #0001}.logo{display:block;width:180px;height:65px;object-fit:contain;margin:0 auto 12px}.title{text-align:center;color:#164b98}.field{margin:14px 0}label{font-weight:700}input{width:100%;box-sizing:border-box;margin-top:6px;padding:13px;border:1px solid #cbd5e2;border-radius:10px}button{width:100%;margin-top:8px;padding:13px;border:0;border-radius:11px;background:#ed1018;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:14px;color:#ed1018;min-height:20px;text-align:center}.hint{font-size:12px;color:#637083;text-align:center;margin-top:16px}</style></head><body><main class="box"><img class="logo" src="icon.svg" alt="Locar Útil"><h2 class="title">AutoCheck</h2><p style="text-align:center">Acesso operacional</p><form id="loginForm"><div class="field"><label>E-mail</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>Senha</label><input name="password" type="password" autocomplete="current-password" required></div><button>Entrar</button></form><div id="loginMsg" class="msg"></div><div class="hint">Acesso individual. O responsável por cada chamado é identificado automaticamente.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script></body></html>
